name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true
      # CI=false only for the build: Create React App turns lint warnings into errors under CI=true,
      # and pre-existing (non-shop) files still have warnings (unused imports, hook deps).
      - name: Production build
        run: npm run build
        env:
          CI: false
